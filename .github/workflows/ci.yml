name: CI

# 每次 push 到 main、以及任何 PR 包括来自 fork 的 PR 都自动跑完整检查。
# 本插件是 TS 源码 + esbuild 构建，lib/index.js 才是发布产物，
# 因此 CI = 安装依赖 → 构建 → 语法检查 → 冒烟测试 → 产物齐全校验，全绿才允许合并。
on:
  push:
    branches:
      - main
  pull_request:
    # fork PR 也可触发；此工作流不读写仓库 secrets，fork 环境下安全。
    branches:
      - main

# 同一分支/PR 上排队的新提交会取消正在跑的旧任务，避免资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: 构建 · 检查 · 冒烟
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 本地与线上主推的运行时，两个版本都验证一次。
        node:
          - 22
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 构建 lib/index.js
        run: npm run build

      - name: 语法检查
        run: node --check lib/index.js

      - name: 冒烟测试
        run: node scripts/smoke.mjs

      - name: 产物齐全性校验
        run: |
          test -f lib/index.js
          test -f cordis.patch.yml
          test -f package.json
          echo "发布产物齐全：lib/index.js · cordis.patch.yml · package.json"
